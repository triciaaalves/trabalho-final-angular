<div class="container">
    @if(clientes.length > 0){
    <div class="row col-md-12">
        <h1 class="text-center my-4">Clientes Cadastrados</h1>

        <!-- <div class="col-12 text-center py-5" *ngIf="isLoading">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Carregando clientes...</span>
        </div>
        <p class="text-muted mt-2">Carregando clientes...</p>
      </div> -->

        <!-- <div class="row mb-3">
            <label for="filtro" class="col-sm-2 col-form-label fw-bold text-end">Pesquisar:</label>
            <div class="col-sm-10">
                <input type="text" class="form-control mb-3" id="filtro" [formControl]="filtro" />
            </div>
        </div> -->
        <div class="d-grid gap-2 d-md-block">
            <button class="btn btn-primary" type="button" (click)="addCliente()">Novo Cliente</button>
        </div>
        @for (cliente of clientes; track cliente.id) {
        <div class="col-sm-6 col-md-4 col-lg-3 my-4">
            <div class="card h-100 shadow-sm">
                <img [src]="cliente.fotoUrl" class="card-img-top mx-auto mt-3 rounded-circle foto-cliente"
                    alt="Foto de {{ cliente.nome }}" (click)="abrirModalImagem(cliente)">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title text-center text-truncate mb-1">{{ cliente.nome }}</h5>
                    <p class="card-text text-muted mb-2 text-truncate">
                        <i class="bi bi-envelope-fill me-1"></i>{{ cliente.email }}
                    </p>
                    <p class="card-text text-muted mb-2">
                        <i class="bi bi-phone-fill me-1"></i>{{ cliente.fone }}
                    </p>
                    <p class="card-text mb-2">
                        <i class="bi bi-house-fill me-1"></i>{{ cliente.endereco }}
                    </p>
                    <div class="mt-auto position-absolute top-0 end-0 pt-2">
                        <i class="bi bi-pen edit-icon" (click)="editCliente(cliente.id!)"></i>
                        <i class="bi bi-trash mx-2" (click)="deleteCliente(cliente.id!)"></i>
                    </div>
                </div>
            </div>
        </div>
        }
    </div>

    <!-- @if(totalPages > 1){
    <nav>
        <ul class="pagination justify-content-center">
            <li class="page-item" [class.disabled]="paginaAtual === 1" (click)="anterior()">
                <a class="page-link">Anterior</a>
            </li>
            @for (pagina of paginasArray(); track pagina) {
            <li class="page-item" [class.active]="pagina === paginaAtual" (click)="irParaPagina(pagina)">
                <a class="page-link">{{ pagina }}</a>
            </li>
            }
            <li class="page-item" [class.disabled]="paginaAtual === totalPages" (click)="proxima()">
                <a class="page-link">Próxima</a>
            </li>
        </ul>
    </nav>
    } -->
    }@else {
    <div class="row">
        <h1 class="text-center">Nenhum Cliente Cadastrado</h1>
    </div>
    }
</div>
