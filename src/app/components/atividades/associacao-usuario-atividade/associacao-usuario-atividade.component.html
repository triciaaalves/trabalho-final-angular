<div class="container mt-4">
    <div class="row">
        <h1 class="text-center">Selecione os usuários para a atividade</h1>
        @if(usuariosOriginal.length > 0 || usuariosSelecionados.length > 0){
        <div class="col">
            <h2 class="text-center m-5">Usuários disponíveis</h2>
            <div cdkDropList id="usuariosOriginal" (cdkDropListDropped)="dropped($event)"
                [cdkDropListData]="usuariosOriginal" class="lista" [cdkDropListConnectedTo]="['usuariosSelecionados']">
                <div *ngFor="let usuario of usuariosOriginal" cdkDrag class="item">{{ usuario.nome }}</div>
            </div>
        </div>
        <div class="col">
            <h2 class="text-center m-5">Usuários Selecionados</h2>
            <div cdkDropList id="usuariosSelecionados" [cdkDropListData]="usuariosSelecionados"
                (cdkDropListDropped)="dropped($event)" class="lista"
                [cdkDropListConnectedTo]="['usuariosOriginal']">
                <div *ngFor="let usuario of usuariosSelecionados" class="item" cdkDrag>{{ usuario.nome }}</div>
            </div>
        </div>
        }@else {
        <h1 class="text-center">Não há usuários cadastrados!</h1>
        }
    </div>
</div>
