<div class="container py-5">
    <div class="row justify-content-between g-4">
        <!-- Coluna A Fazer -->
        <div class="col-md-4">
            <div class="card bg-success text-light shadow">
                <div class="card-body">
                    <h5 class="card-title mb-3">A fazer</h5>

                    <!-- Cards de tarefas -->
                    <div class="card mb-2 shadow-sm">
                        <div class="card-body py-2">
                            Comece a usar o Trello
                        </div>
                    </div>

                    <div class="card mb-2 shadow-sm">
                        <div class="card-body py-2">
                            Atividade 2
                        </div>
                    </div>

                    <button class="btn btn-outline-light btn-sm w-100 mt-3">Adicionar um cartão</button>
                </div>
            </div>
        </div>

        <!-- Coluna Em Andamento -->
        <div class="col-md-4">
            <div class="card bg-success text-light shadow">
                <div class="card-body">
                    <h5 class="card-title mb-3">Em andamento</h5>

                    <div class="card mb-2 shadow-sm">
                        <div class="card-body py-2">
                            Atividade 1
                        </div>
                    </div>

                    <button class="btn btn-outline-light btn-sm w-100 mt-3">Adicionar um cartão</button>
                </div>
            </div>
        </div>

        <!-- Coluna Concluído -->
        <div class="col-md-4">
            <div class="card bg-success text-light shadow">
                <div class="card-body">
                    <h5 class="card-title mb-3">Concluído</h5>

                    <div class="card mb-2 shadow-sm">
                        <div class="card-body py-2">
                            Atividade 3
                        </div>
                    </div>

                    <button class="btn btn-outline-light btn-sm w-100 mt-3">Adicionar um cartão</button>
                </div>
            </div>
        </div>
    </div>
</div>
