<div class="toast-container position-fixed top-0 end-0 p-3 mt-5" style="z-index: 1000;">
    <div #liveToast class="toast align-items-center border-0" role="alert" aria-live="assertive"
        aria-atomic="true">
        <div class="toast-header text-white bg-danger"
            [ngClass]="{
                'bg-success': currentToastData.type === 'success',
                'bg-danger': currentToastData.type === 'danger',
                'bg-info': currentToastData.type === 'info',
                'bg-warning': currentToastData.type === 'warning'
            }" data-bs-theme="dark">
            <strong class="me-auto">{{ currentToastData.title }}</strong>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                aria-label="Close"></button>
        </div>
        <div class="toast-body bg-body-white">
            {{ currentToastData.message }}
        </div>
    </div>
</div>
